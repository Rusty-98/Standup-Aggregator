version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/data/syncpulse.db
      - SESSION_SECRET=c1f4e0c382f6e5a1b3d7890abcdef1234567890abcdef1234567890abcdef12
      - ORG_TIMEZONE=Asia/Kolkata
      - DIGEST_TIME=20:00
      - ALLOWED_EMAIL_DOMAINS=company.com,gmail.com,example.com
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - MAIL_FROM=SyncPulse <standup@company.com>
      - ENABLE_CRON=true
    volumes:
      - syncpulse_data:/data
    depends_on:
      - mailhog
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI for email inspection
    restart: unless-stopped

volumes:
  syncpulse_data:
