services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/data/dailies.db
      - EXPORT_DIR=/data/exports
    volumes:
      - dailies_data:/data
    depends_on:
      - mailhog
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI for email inspection
    restart: unless-stopped

volumes:
  dailies_data:
    name: standup-aggregator_syncpulse_data
